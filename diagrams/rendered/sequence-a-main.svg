<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1241" viewBox="0 0 1860 1241" role="img" aria-label="Вариант A — основной сценарий доставки">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#456b98"/></marker>
  <marker id="arrowAccent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#bd7b25"/></marker>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #172b4d; }
    .subtitle { font-size: 14px; fill: #53657d; }
    .actor { fill: #eaf1fb; stroke: #7e9dc4; stroke-width: 1.4; }
    .actor-text { font-size: 12px; font-weight: 600; fill: #1f3b60; text-anchor: middle; }
    .life { stroke: #b1bdcb; stroke-width: 1.2; stroke-dasharray: 5 6; }
    .msg { stroke: #456b98; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .msg-accent { stroke: #bd7b25; stroke-width: 1.9; fill: none; marker-end: url(#arrowAccent); }
    .msg-dash { stroke-dasharray: 7 5; }
    .msg-text { font-size: 12px; fill: #24364b; text-anchor: middle; }
    .note { fill: #fff7e8; stroke: #e2bc78; stroke-width: 1.2; }
    .note-text { font-size: 12px; fill: #62491f; }
    .footer { font-size: 11px; fill: #6b7788; }
  </style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="#f7f9fc"/>
<text class="title" x="48" y="46">Вариант A — основной сценарий доставки</text>
<text class="subtitle" x="48" y="73">Kafka передаёт событие, Temporal управляет шагами процесса и ожидает подтверждение приложения.</text>

<rect class="actor" x="22" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="90" y="110">Bank Core</text>
<line class="life" x1="90" y1="154" x2="90" y2="1203"/>
<rect class="actor" x="180" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="248" y="110">Notification API</text>
<line class="life" x1="248" y1="154" x2="248" y2="1203"/>
<rect class="actor" x="338" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="406" y="110">PostgreSQL</text>
<line class="life" x1="406" y1="154" x2="406" y2="1203"/>
<rect class="actor" x="496" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="564" y="110">Outbox Relay</text>
<line class="life" x1="564" y1="154" x2="564" y2="1203"/>
<rect class="actor" x="654" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="722" y="110">Kafka</text>
<line class="life" x1="722" y1="154" x2="722" y2="1203"/>
<rect class="actor" x="812" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="880" y="110">Temporal Starter</text>
<line class="life" x1="880" y1="154" x2="880" y2="1203"/>
<rect class="actor" x="970" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1038" y="110">Temporal Workflow</text>
<line class="life" x1="1038" y1="154" x2="1038" y2="1203"/>
<rect class="actor" x="1128" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1196" y="110">Push Activity</text>
<line class="life" x1="1196" y1="154" x2="1196" y2="1203"/>
<rect class="actor" x="1286" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1354" y="110">FCM / APNs</text>
<line class="life" x1="1354" y1="154" x2="1354" y2="1203"/>
<rect class="actor" x="1444" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1512" y="110">Mobile App</text>
<line class="life" x1="1512" y1="154" x2="1512" y2="1203"/>
<rect class="actor" x="1602" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1670" y="110">Callback API</text>
<line class="life" x1="1670" y1="154" x2="1670" y2="1203"/>
<line class="msg" x1="90" y1="234.0" x2="248" y2="234.0"/>
<text class="msg-text" x="169.0" y="212" text-anchor="middle">POST critical event +</text>
<text class="msg-text" x="169.0" y="228" text-anchor="middle">idempotency_key</text>
<line class="msg" x1="248" y1="300.0" x2="406" y2="300.0"/>
<text class="msg-text" x="327.0" y="278" text-anchor="middle">Сохранить notification + inbox +</text>
<text class="msg-text" x="327.0" y="294" text-anchor="middle">outbox</text>
<line class="msg msg-dash" x1="406" y1="361.0" x2="248" y2="361.0"/>
<text class="msg-text" x="327.0" y="344" text-anchor="middle">COMMIT</text>
<line class="msg" x1="248" y1="417.0" x2="90" y2="417.0"/>
<text class="msg-text" x="169.0" y="400" text-anchor="middle">202 Accepted + notification_id</text>
<line class="msg" x1="564" y1="473.0" x2="406" y2="473.0"/>
<text class="msg-text" x="485.0" y="456" text-anchor="middle">Прочитать неопубликованный outbox</text>
<line class="msg msg-dash" x1="564" y1="529.0" x2="722" y2="529.0"/>
<text class="msg-text" x="643.0" y="512" text-anchor="middle">Опубликовать P0 event</text>
<line class="msg msg-dash" x1="722" y1="585.0" x2="880" y2="585.0"/>
<text class="msg-text" x="801.0" y="568" text-anchor="middle">Получить транзакционное событие</text>
<line class="msg" x1="880" y1="641.0" x2="1038" y2="641.0"/>
<text class="msg-text" x="959.0" y="624" text-anchor="middle">Start Workflow(notification_id)</text>
<line class="msg" x1="1038" y1="697.0" x2="1196" y2="697.0"/>
<text class="msg-text" x="1117.0" y="680" text-anchor="middle">Запустить Push Activity</text>
<line class="msg" x1="1196" y1="753.0" x2="1354" y2="753.0"/>
<text class="msg-text" x="1275.0" y="736" text-anchor="middle">Submit push</text>
<line class="msg msg-dash" x1="1354" y1="809.0" x2="1196" y2="809.0"/>
<text class="msg-text" x="1275.0" y="792" text-anchor="middle">Accepted + provider_message_id</text>
<line class="msg" x1="1196" y1="865.0" x2="406" y2="865.0"/>
<text class="msg-text" x="801.0" y="848" text-anchor="middle">Сохранить ACCEPTED_BY_PROVIDER</text>
<line class="msg msg-dash" x1="1354" y1="921.0" x2="1512" y2="921.0"/>
<text class="msg-text" x="1433.0" y="904" text-anchor="middle">Доставка Push — best effort</text>
<line class="msg-accent" x1="1512" y1="977.0" x2="1670" y2="977.0"/>
<text class="msg-text" x="1591.0" y="960" text-anchor="middle">App ACK(notification_id)</text>
<line class="msg msg-dash" x1="1670" y1="1033.0" x2="1038" y2="1033.0"/>
<text class="msg-text" x="1354.0" y="1016" text-anchor="middle">Signal AppAcknowledged</text>
<line class="msg" x1="1038" y1="1089.0" x2="406" y2="1089.0"/>
<text class="msg-text" x="722.0" y="1072" text-anchor="middle">Записать DEVICE_ACKNOWLEDGED</text>
<path class="msg" d="M 1038 1145.0 h 34 v 22 h -27"/>
<text class="msg-text" x="1146" y="1129" text-anchor="start">Завершить Workflow</text>
<text class="footer" x="48" y="1228">Пунктирная линия — асинхронное сообщение или callback. Подтверждение провайдера не равно подтверждению на устройстве.</text>
</svg>