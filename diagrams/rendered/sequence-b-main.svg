<svg xmlns="http://www.w3.org/2000/svg" width="1855" height="1287" viewBox="0 0 1855 1287" role="img" aria-label="Вариант B — основной сценарий доставки">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#456b98"/></marker>
  <marker id="arrowAccent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#bd7b25"/></marker>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #172b4d; }
    .subtitle { font-size: 14px; fill: #53657d; }
    .actor { fill: #eaf1fb; stroke: #7e9dc4; stroke-width: 1.4; }
    .actor-text { font-size: 12px; font-weight: 600; fill: #1f3b60; text-anchor: middle; }
    .life { stroke: #b1bdcb; stroke-width: 1.2; stroke-dasharray: 5 6; }
    .msg { stroke: #456b98; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .msg-accent { stroke: #bd7b25; stroke-width: 1.9; fill: none; marker-end: url(#arrowAccent); }
    .msg-dash { stroke-dasharray: 7 5; }
    .msg-text { font-size: 12px; fill: #24364b; text-anchor: middle; }
    .note { fill: #fff7e8; stroke: #e2bc78; stroke-width: 1.2; }
    .note-text { font-size: 12px; fill: #62491f; }
    .footer { font-size: 11px; fill: #6b7788; }
  </style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="#f7f9fc"/>
<text class="title" x="48" y="46">Вариант B — основной сценарий доставки</text>
<text class="subtitle" x="48" y="73">Состояние управляется собственной State Machine; PostgreSQL хранит переход и задачу в outbox.</text>

<rect class="actor" x="22" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="90" y="110">Bank Core</text>
<line class="life" x1="90" y1="154" x2="90" y2="1249"/>
<rect class="actor" x="197" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="265" y="110">Notification API</text>
<line class="life" x1="265" y1="154" x2="265" y2="1249"/>
<rect class="actor" x="372" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="440" y="110">PostgreSQL FSM</text>
<line class="life" x1="440" y1="154" x2="440" y2="1249"/>
<rect class="actor" x="547" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="615" y="110">Outbox Relay</text>
<line class="life" x1="615" y1="154" x2="615" y2="1249"/>
<rect class="actor" x="722" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="790" y="110">Kafka</text>
<line class="life" x1="790" y1="154" x2="790" y2="1249"/>
<rect class="actor" x="897" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="965" y="110">Router</text>
<line class="life" x1="965" y1="154" x2="965" y2="1249"/>
<rect class="actor" x="1072" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1140" y="110">Push Worker</text>
<line class="life" x1="1140" y1="154" x2="1140" y2="1249"/>
<rect class="actor" x="1247" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1315" y="110">FCM / APNs</text>
<line class="life" x1="1315" y1="154" x2="1315" y2="1249"/>
<rect class="actor" x="1422" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1490" y="110">Mobile App</text>
<line class="life" x1="1490" y1="154" x2="1490" y2="1249"/>
<rect class="actor" x="1597" y="84.5" width="136" height="43" rx="9"/>
<text class="actor-text" x="1665" y="110">Callback API</text>
<line class="life" x1="1665" y1="154" x2="1665" y2="1249"/>
<line class="msg" x1="90" y1="229.0" x2="265" y2="229.0"/>
<text class="msg-text" x="177.5" y="212" text-anchor="middle">POST event + idempotency_key</text>
<line class="msg" x1="265" y1="285.0" x2="440" y2="285.0"/>
<text class="msg-text" x="352.5" y="268" text-anchor="middle">BEGIN: notification + outbox</text>
<line class="msg msg-dash" x1="440" y1="341.0" x2="265" y2="341.0"/>
<text class="msg-text" x="352.5" y="324" text-anchor="middle">COMMIT</text>
<line class="msg" x1="265" y1="397.0" x2="90" y2="397.0"/>
<text class="msg-text" x="177.5" y="380" text-anchor="middle">202 Accepted + notification_id</text>
<line class="msg" x1="615" y1="453.0" x2="440" y2="453.0"/>
<text class="msg-text" x="527.5" y="436" text-anchor="middle">Прочитать outbox</text>
<line class="msg msg-dash" x1="615" y1="509.0" x2="790" y2="509.0"/>
<text class="msg-text" x="702.5" y="492" text-anchor="middle">Опубликовать P0 event</text>
<line class="msg msg-dash" x1="790" y1="565.0" x2="965" y2="565.0"/>
<text class="msg-text" x="877.5" y="548" text-anchor="middle">Получить событие</text>
<line class="msg" x1="965" y1="626.0" x2="440" y2="626.0"/>
<text class="msg-text" x="702.5" y="604" text-anchor="middle">CAS NEW → PUSH_PENDING; task +</text>
<text class="msg-text" x="702.5" y="620" text-anchor="middle">outbox</text>
<line class="msg msg-dash" x1="615" y1="687.0" x2="790" y2="687.0"/>
<text class="msg-text" x="702.5" y="670" text-anchor="middle">Опубликовать push task</text>
<line class="msg msg-dash" x1="790" y1="743.0" x2="1140" y2="743.0"/>
<text class="msg-text" x="965.0" y="726" text-anchor="middle">Push task</text>
<line class="msg" x1="1140" y1="799.0" x2="1315" y2="799.0"/>
<text class="msg-text" x="1227.5" y="782" text-anchor="middle">Submit push</text>
<line class="msg msg-dash" x1="1315" y1="855.0" x2="1140" y2="855.0"/>
<text class="msg-text" x="1227.5" y="838" text-anchor="middle">Accepted + provider_message_id</text>
<line class="msg" x1="1140" y1="911.0" x2="440" y2="911.0"/>
<text class="msg-text" x="790.0" y="894" text-anchor="middle">Сохранить результат попытки</text>
<line class="msg msg-dash" x1="1315" y1="967.0" x2="1490" y2="967.0"/>
<text class="msg-text" x="1402.5" y="950" text-anchor="middle">Доставка Push — best effort</text>
<line class="msg-accent" x1="1490" y1="1023.0" x2="1665" y2="1023.0"/>
<text class="msg-text" x="1577.5" y="1006" text-anchor="middle">App ACK(notification_id)</text>
<line class="msg msg-dash" x1="1665" y1="1079.0" x2="790" y2="1079.0"/>
<text class="msg-text" x="1227.5" y="1062" text-anchor="middle">Callback event</text>
<line class="msg msg-dash" x1="790" y1="1135.0" x2="965" y2="1135.0"/>
<text class="msg-text" x="877.5" y="1118" text-anchor="middle">Применить callback</text>
<line class="msg" x1="965" y1="1191.0" x2="440" y2="1191.0"/>
<text class="msg-text" x="702.5" y="1174" text-anchor="middle">CAS WAITING → DEVICE_ACKNOWLEDGED</text>
<text class="footer" x="48" y="1274">Пунктирная линия — асинхронное сообщение или callback. Подтверждение провайдера не равно подтверждению на устройстве.</text>
</svg>